  <ellipse cx="980" cy="60" rx="420" ry="260" fill="url(#glow)"/>
  <ellipse cx="180" cy="300" rx="360" ry="220" fill="url(#glow)" opacity="0.6"/>

  <path d="M40 34 H150" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 34 V90" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M1160 286 H1050" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M1160 286 V230" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>

  <text x="600" y="150" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="8">REYES RIVERA</text>

  <text x="600" y="192" text-anchor="middle" fill="#9FB0C3" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="5">FULL-STACK DEVELOPER · AI-DRIVEN ENGINEERING</text>

  <rect x="450" y="214" width="300" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="600" y="262" text-anchor="middle" fill="#00D4FF" font-family="Consolas, Menlo, Monaco, monospace" font-size="18" letter-spacing="1">React · TypeScript · Node.js · Express · AI Agents</text>

  <text x="40" y="300" fill="#4A5D72" font-family="Consolas, Menlo, Monaco, monospace" font-size="15">~/reyes $ whoami</text>
